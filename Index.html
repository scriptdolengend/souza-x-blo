
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>SOUZA X BLOX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:white;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 7%;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900}
.logo span,h1 span{color:#f22}
button{border:0;border-radius:8px;padding:13px;background:#d00000;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#f22}
input{width:100%;padding:14px;background:#080808;border:1px solid #444;color:white;border-radius:8px;margin:10px 0}
.hero{text-align:center;padding:75px 20px}
h1{font-size:clamp(38px,8vw,68px)}
p{color:#aaa;margin:14px 0;line-height:1.6}
.panel{background:#131313;border:1px solid #333;border-radius:14px;padding:23px;max-width:500px;margin:25px auto;text-align:left}
.panel h2{text-align:center;margin-bottom:15px}
.full{width:100%}
.secondary{background:#333}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:#080808;border:1px solid #333;padding:17px;border-radius:9px}
.stat strong{display:block;font-size:25px;margin-top:8px;color:#f33}
.item{background:#222;padding:12px;margin:10px 0;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.item button{width:auto;padding:9px}
#result{margin-top:12px;color:#f55}
footer{text-align:center;padding:30px;color:#666;border-top:1px solid #292929}
@media(max-width:600px){.grid{grid-template-columns:1fr}header{padding:18px}}
</style>
</head>
<body>

<header>
<div class="logo">SOUZA <span>X BLOX</span></div>
<button onclick="openLogin()">PAINEL ADM</button>
</header>

<main>
<section id="home" class="hero">
<h1>SOUZA <span>X BLOX</span></h1>
<p>PREMIUM SCRIPT HUB</p>

<div class="panel">
<h2>ATIVAR KEY</h2>
<input id="accessKey" placeholder="Digite sua Key">
<button class="full" onclick="activate()">ATIVAR ACESSO</button>
<div id="result"></div>
</div>
</section>

<section id="adminLogin" class="hidden">
<div class="panel">
<h2>LOGIN ADMINISTRATIVO</h2>
<input id="adminPassword" type="password" placeholder="Senha ADM">
<button class="full" onclick="adminLogin()">ENTRAR</button>
<button class="full secondary" onclick="goHome()">VOLTAR</button>
<p id="loginMessage"></p>
</div>
</section>

<section id="dashboard" class="hidden">
<div class="hero">
<h1>PAINEL <span>ADM</span></h1>
<p>GERENCIAMENTO SOUZA X BLOX</p>
</div>

<div class="panel">
<div class="grid">
<div class="stat">TOTAL<strong id="total">0</strong></div>
<div class="stat">ATIVAS<strong id="active">0</strong></div>
<div class="stat">BLOQUEADAS<strong id="blocked">0</strong></div>
</div>

<h2>CRIAR KEY</h2>
<input id="newKey" placeholder="Nome da Key">
<button class="full" onclick="createKey()">CRIAR KEY</button>

<h2 style="margin-top:30px">GERENCIAR KEYS</h2>
<div id="keyList"></div>

<h2 style="margin-top:30px">HISTÓRICO</h2>
<div id="history"></div>

<button class="full secondary" onclick="logout()">SAIR DO PAINEL</button>
</div>
</section>
</main>

<footer>© 2026 SOUZA X BLOX</footer>

<script>
const ADMIN_PASSWORD="Stx6";
const ACCESS_KEY="Stx6";

const DB_KEYS="sxb_keys";
const DB_HISTORY="sxb_history";

let isAdmin=false;

function getKeys(){
 try{return JSON.parse(localStorage.getItem(DB_KEYS)||"[]")}
 catch{return []}
}

function saveKeys(data){
 localStorage.setItem(DB_KEYS,JSON.stringify(data));
}

function getHistory(){
 try{return JSON.parse(localStorage.getItem(DB_HISTORY)||"[]")}
 catch{return []}
}

function saveHistory(data){
 localStorage.setItem(DB_HISTORY,JSON.stringify(data));
}

function show(id){
 ["home","adminLogin","dashboard"].forEach(x=>{
 document.getElementById(x).classList.toggle("hidden",x!==id);
 });
}

function goHome(){show("home")}

function openLogin(){
 show("adminLogin");
}

function adminLogin(){
 const password=document.getElementById("adminPassword").value;
 if(password===ADMIN_PASSWORD){
 isAdmin=true;
 show("dashboard");
 render();
 }else{
 document.getElementById("loginMessage").textContent="Senha incorreta!";
 }
}

function activate(){
 const value=document.getElementById("accessKey").value.trim();
 const result=document.getElementById("result");

 if(!value){
 result.textContent="Digite sua Key!";
 return;
 }

 const keys=getKeys();
 const valid=value===ACCESS_KEY ||
 keys.some(k=>k.name===value&&k.active);

 if(!valid){
 result.textContent="Key inválida ou bloqueada!";
 return;
 }

 const history=getHistory();
 history.unshift({
 key:value,
 date:new Date().toLocaleString("pt-BR")
 });
 saveHistory(history);

 result.textContent="Acesso autorizado!";
 result.style.color="#55dd88";
}

function createKey(){
 if(!isAdmin)return;

 const input=document.getElementById("newKey");
 const name=input.value.trim();

 if(!name)return alert("Digite uma Key!");
 if(name===ACCESS_KEY)return alert("Key reservada!");

 const keys=getKeys();

 if(keys.some(k=>k.name===name)){
 return alert("Essa Key já existe!");
 }

 keys.push({name,active:true});
 saveKeys(keys);

 input.value="";
 render();
}

function generateKey(){
 return "SXB-"+Math.random().toString(36).slice(2,10).toUpperCase();
}

function createRandomKey(){
 document.getElementById("newKey").value=generateKey();
 createKey();
}

function render(){
 if(!isAdmin)return;

 const keys=getKeys();

 document.getElementById("total").textContent=keys.length;
 document.getElementById("active").textContent=keys.filter(k=>k.active).length;
 document.getElementById("blocked").textContent=keys.filter(k=>!k.active).length;

 const list=document.getElementById("keyList");
 list.replaceChildren();

 keys.forEach((k,i)=>{
 const row=document.createElement("div");
 row.className="item";

 const label=document.createElement("span");
 label.textContent=k.name+" — "+(k.active?"ATIVA":"BLOQUEADA");

 const toggle=document.createElement("button");
 toggle.textContent=k.active?"BLOQUEAR":"LIBERAR";
 toggle.onclick=()=>{
 const data=getKeys();
 data[i].active=!data[i].active;
 saveKeys(data);
 render();
 };

 const remove=document.createElement("button");
 remove.textContent="EXCLUIR";
 remove.className="secondary";
 remove.onclick=()=>{
 if(!confirm("Excluir esta Key?"))return;
 const data=getKeys();
 data.splice(i,1);
 saveKeys(data);
 render();
 };

 row.append(label,toggle,remove);
 list.appendChild(row);
 });

 const history=getHistory();
 const historyBox=document.getElementById("history");
 historyBox.replaceChildren();

 history.slice(0,30).forEach(item=>{
 const row=document.createElement("div");
 row.className="item";
 const label=document.createElement("span");
 label.textContent=item.key;
 const date=document.createElement("small");
 date.textContent=item.date;
 row.append(label,date);
 historyBox.appendChild(row);
 });

 if(!history.length){
 historyBox.textContent="Nenhuma ativação registrada.";
 }
}

function logout(){
 isAdmin=false;
 document.getElementById("adminPassword").value="";
 show("home");
}
</script>
</body>
</html>
